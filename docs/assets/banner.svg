<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Faultline Lab</title>
  <desc id="desc">Three connected services beside a fault line: a laboratory for scale, failure and recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1527"/>
      <stop offset="1" stop-color="#15253b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30445e" stroke-width=".6" opacity=".28"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>
  <path d="M708 0L680 65L714 125L674 185L705 247L670 340" fill="none" stroke="#f4b860" stroke-width="2" opacity=".65"/>
  <path d="M720 0L692 65L726 125L686 185L717 247L682 340" fill="none" stroke="#f4b860" stroke-width="1" opacity=".18"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="75" fill="#79d8c4" font-size="12" font-weight="700" letter-spacing="3">SCALE / FAILURE / RECOVERY</text>
    <text x="60" y="162" fill="#f4f7fb" font-size="66" font-weight="700" letter-spacing="-2">Faultline<tspan dx="14" fill="#79d8c4">Lab</tspan></text>
    <text x="64" y="211" fill="#b6c6d9" font-size="20">Three services. Measurable decisions.</text>
    <rect x="64" y="259" width="237" height="28" rx="14" fill="#23374e"/>
    <circle cx="81" cy="273" r="4" fill="#79d8c4"/>
    <text x="95" y="278" fill="#d4e1ef" font-size="12">HUMAN-LED AI DEVELOPMENT</text>
    <g fill="none" stroke="#79d8c4" stroke-width="2">
      <path d="M894 125L826 220M894 125L1020 220M826 220H1020"/>
    </g>
    <g fill="#15283e" stroke="#49647e">
      <rect x="825" y="79" width="170" height="82" rx="12"/>
      <rect x="738" y="216" width="176" height="82" rx="12"/>
      <rect x="948" y="216" width="176" height="82" rx="12"/>
    </g>
    <g fill="#eaf1f8" text-anchor="middle" font-size="18" font-weight="600">
      <text x="910" y="114">Orders</text>
      <text x="826" y="251">Inventory</text>
      <text x="1036" y="251">Payments</text>
    </g>
    <g fill="#91a9c2" text-anchor="middle" font-size="12">
      <text x="910" y="138">durable workflow</text>
      <text x="826" y="275">stock + reservations</text>
      <text x="1036" y="275">debits + refunds</text>
    </g>
    <text x="1068" y="69" fill="#f4b860" font-size="12" letter-spacing="1">gRPC + Kafka</text>
  </g>
</svg>
