<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Faultline Lab — Experiment Flow</title>
  <desc id="desc">An ivory research canvas with lavender, peach and mint waves passing through an observation frame. Decorative curves represent experiments, not measured results.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#f3eff9"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#bbb0d9"/>
      <stop offset=".52" stop-color="#debaaf"/>
      <stop offset="1" stop-color="#9dc3b9"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#paper)"/>
  <g clip-path="url(#clip)">
    <circle cx="1155" cy="69" r="246" fill="#e4dcf2" opacity=".5"/>
    <circle cx="1276" cy="390" r="224" fill="#e0eee8" opacity=".65"/>
    <path d="M699 280C785 280 783 110 891 110S1017 318 1104 280S1206 133 1321 188" fill="none" stroke="url(#flow)" stroke-width="27" opacity=".27"/>
    <g fill="none" stroke-linecap="round" stroke-width="2.5">
      <path d="M699 244C789 244 788 98 890 98S1016 304 1108 267S1230 126 1321 161" stroke="#8e80b4"/>
      <path d="M699 279C789 279 788 131 890 131S1016 336 1108 299S1230 158 1321 194" stroke="#aa8579"/>
      <path d="M699 311C789 311 788 166 890 166S1016 369 1108 332S1230 191 1321 227" stroke="#7ba399"/>
    </g>
    <rect x="929" y="61" width="126" height="302" rx="63" fill="#ffffff" fill-opacity=".52" stroke="#c5bbd8" stroke-width="1.5"/>
    <path d="M952 213H1032M992 174V251" stroke="#a093b9" stroke-width="1" opacity=".6"/>
    <circle cx="992" cy="213" r="12" fill="#fbf8f3" stroke="#796d99" stroke-width="2"/>
    <circle cx="890" cy="98" r="6" fill="#fbf8f3" stroke="#8e80b4" stroke-width="2"/>
    <circle cx="1108" cy="299" r="6" fill="#fbf8f3" stroke="#aa8579" stroke-width="2"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="82" font-size="15" font-weight="600" letter-spacing="2.5" fill="#685b76">A LAB FOR BETTER QUESTIONS</text>
    <text x="59" y="205" font-size="77" font-weight="650" letter-spacing="-3.2" fill="#343747">Faultline<tspan dx="16" fill="#776695">Lab</tspan></text>
    <text x="64" y="254" font-size="25" fill="#625c70">Explore how systems behave.</text>
    <g font-size="15" font-weight="600">
      <rect x="64" y="316" width="113" height="38" rx="19" fill="#e9e1f4"/>
      <text x="120" y="341" text-anchor="middle" fill="#66517d">Hypothesis</text>
      <path d="M192 335H216M211 330L216 335L211 340" stroke="#8b8095" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="232" y="316" width="119" height="38" rx="19" fill="#f2e3da"/>
      <text x="291" y="341" text-anchor="middle" fill="#805e4e">Experiment</text>
      <path d="M366 335H390M385 330L390 335L385 340" stroke="#8b8095" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="406" y="316" width="112" height="38" rx="19" fill="#dfece6"/>
      <text x="462" y="341" text-anchor="middle" fill="#466a5c">Evidence</text>
    </g>
    <text x="992" y="389" text-anchor="middle" font-size="13" fill="#6a607b" letter-spacing="2">OBSERVE THE CHANGE</text>
  </g>
</svg>
