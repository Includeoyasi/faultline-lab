<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Faultline Lab — System Map</title>
  <desc id="desc">A soft blue and mint research canvas with three connected microservices. A proposed banner for a lab studying systems through experiments.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#edf6f2"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#b4c2cf" opacity=".38"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#paper)"/>
  <rect x="704" y="30" width="548" height="360" rx="24" fill="url(#dots)"/>
  <path d="M687 66V354" stroke="#d2dce4"/>
