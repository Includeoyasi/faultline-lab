services:
  toolchain:
    profiles: [tools]
    build:
      context: .
      dockerfile: build/toolchain.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    security_opt:
      - no-new-privileges:true

volumes:
  go-modules:
  go-build:
