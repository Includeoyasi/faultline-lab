x-runtime: &runtime
  env_file:
    - ${FL_RUNTIME_ENV_FILE:-configs/env/container.env.example}
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 15s
  networks: [runtime]
  healthcheck:
    test: [CMD, /app/service, healthcheck]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 5s

x-service-build: &service-build
  context: .
  dockerfile: build/Dockerfile
  target: runtime

services:
  orders:
    <<: *runtime
    build:
      <<: *service-build
      args:
        SERVICE: orders
  inventory:
    <<: *runtime
    build:
      <<: *service-build
      args:
        SERVICE: inventory
  payments:
    <<: *runtime
    build:
      <<: *service-build
      args:
        SERVICE: payments
  toolchain:
    profiles: [tools]
    build:
      context: .
      dockerfile: build/Dockerfile
      target: toolchain
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
    security_opt:
      - no-new-privileges:true

volumes:
  go-modules:
  go-build:

networks:
  runtime:
    internal: true
